apiVersion: v1
kind: ConfigMap
metadata:
  name: architectai-config
  namespace: architectai
data:
  APP_ENV: "production"
  PYTHONUNBUFFERED: "1"
  STREAMLIT_SERVER_PORT: "8501"
  STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
  DEFAULT_LLM_PROVIDER: "groq"
  REDIS_HOST: "architectai-redis"
  REDIS_PORT: "6379"
  CHROMA_DB_PATH: "/app/data/chroma_db"
