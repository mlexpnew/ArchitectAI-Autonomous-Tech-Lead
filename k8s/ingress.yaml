apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: architectai-ingress
  namespace: architectai
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - architectai.example.com
      secretName: architectai-tls-cert
  rules:
    - host: architectai.example.com
      http:
        paths:
          # REST API & Swagger Documentation routes
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: architectai-service
                port:
                  number: 8000
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: architectai-service
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: architectai-service
                port:
                  number: 8000
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: architectai-service
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: architectai-service
                port:
                  number: 8000
          # Interactive Web UI Dashboard
          - path: /
            pathType: Prefix
            backend:
              service:
                name: architectai-service
                port:
                  number: 8501
