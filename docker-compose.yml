services:
  architectai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: architectai-platform
    ports:
      - "8501:8501"   # ArchitectAI Interactive Web Dashboard
      - "8000:8000"   # Optional REST API & Health probe
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - CHROMA_DB_PATH=/app/data/chroma_db
    env_file:
      - .env
    volumes:
      - ./app.py:/app/app.py
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: architectai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
